<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="rgba(37,99,176,0.15)"/>
  <circle cx="150" cy="380" r="90" fill="rgba(29,78,216,0.1)"/>
  <!-- Building silhouette -->
  <rect x="200" y="180" width="400" height="200" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="220" y="160" width="100" height="220" fill="rgba(255,255,255,0.07)" rx="4"/>
  <rect x="340" y="200" width="80" height="180" fill="rgba(255,255,255,0.06)" rx="4"/>
  <rect x="440" y="170" width="120" height="210" fill="rgba(255,255,255,0.07)" rx="4"/>
  <!-- Windows -->
  <rect x="240" y="190" width="16" height="12" fill="rgba(255,220,100,0.4)" rx="2"/>
  <rect x="266" y="190" width="16" height="12" fill="rgba(255,220,100,0.3)" rx="2"/>
  <rect x="240" y="215" width="16" height="12" fill="rgba(255,220,100,0.5)" rx="2"/>
  <rect x="266" y="215" width="16" height="12" fill="rgba(255,220,100,0.2)" rx="2"/>
  <!-- Ground -->
  <rect x="0" y="370" width="800" height="90" fill="rgba(0,0,0,0.3)"/>
  <!-- Label -->
  <text x="400" y="430" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.3)" text-anchor="middle">Ganti dengan foto kegiatan alumni PPKD</text>
</svg>
